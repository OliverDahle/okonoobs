<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude API Test</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f5f5f5; }
    h1 { color: #1A1A1A; }
    button { background: #D02927; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 8px 4px; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin: 16px 0; padding: 12px; border-radius: 8px; font-size: 14px; }
    .ok { background: #d4edda; color: #155724; }
    .feil { background: #f8d7da; color: #721c24; }
    .laster { background: #fff3cd; color: #856404; }
    #svar { margin-top: 16px; padding: 16px; background: white; border-radius: 8px; border: 1px solid #E0E0E0; min-height: 60px; font-size: 15px; white-space: pre-wrap; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>Claude API Test</h1>

  <button id="testEnkel" onclick="testEnkel()">Test enkelt kall</button>
  <button id="testStream" onclick="testStream()">Test streaming</button>

  <div id="status"></div>
  <div id="svar"></div>

  <script src="/js/config.js"></script>
  <script type="module">
    import { spor, sporStream } from '/js/claude-api.js';

    window.testEnkel = async function () {
      const btn = document.getElementById('testEnkel');
      const status = document.getElementById('status');
      const svar = document.getElementById('svar');

      btn.disabled = true;
      status.className = 'laster';
      status.textContent = 'Sender forespørsel...';
      svar.textContent = '';

      try {
        const tekst = await spor([
          { role: 'user', content: 'Si "API-tilkobling OK" og ingenting annet.' }
        ]);
        status.className = 'ok';
        status.textContent = 'Suksess. Enkelt kall fungerer.';
        svar.textContent = tekst;
      } catch (e) {
        status.className = 'feil';
        status.textContent = 'Feil: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    };

    window.testStream = async function () {
      const btn = document.getElementById('testStream');
      const status = document.getElementById('status');
      const svar = document.getElementById('svar');

      btn.disabled = true;
      status.className = 'laster';
      status.textContent = 'Strommer svar...';
      svar.textContent = '';

      try {
        await sporStream(
          [{ role: 'user', content: 'Tell meg én morsom økonomi-vits på norsk. Kort.' }],
          (_token, fullTekst) => { svar.textContent = fullTekst; }
        );
        status.className = 'ok';
        status.textContent = 'Suksess. Streaming fungerer.';
      } catch (e) {
        status.className = 'feil';
        status.textContent = 'Feil: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
