name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build
        if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build

      - name: Prepare dist (vanilla HTML)
        if: hashFiles('package.json') == ''
        run: |
          mkdir -p dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='dist' --exclude='CLAUDE.md' . dist/

      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 204.168.153.113 >> ~/.ssh/known_hosts
          rsync -avz --delete dist/ root@204.168.153.113:/var/www/okonoobs/public/
